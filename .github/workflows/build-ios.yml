name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Patch all ExpoModulesJSI scripts
        run: |
          echo "=== Finding all ExpoModulesJSI related scripts ==="
          find ios/Pods -path "*ExpoModulesJSI*" -name "*.sh" -type f 2>/dev/null
          find ios/Pods -path "*ExpoModulesJSI*" -name "post_install*" -type f 2>/dev/null
          # Patch every .sh file in ExpoModulesJSI target support
          find ios/Pods/Target\ Support\ Files/ExpoModulesJSI -name "*.sh" -type f 2>/dev/null | while read f; do
            echo "Patching: $f"
            echo '#!/bin/bash' > "$f"
            echo 'exit 0' >> "$f"
            chmod +x "$f"
          done
          # Also find the script by content - search for xcframework build logic
          grep -rl "ExpoModulesJSI" ios/Pods/Target\ Support\ Files/ 2>/dev/null | while read f; do
            if [[ "$f" == *.sh ]]; then
              echo "Patching by content match: $f"
              echo '#!/bin/bash' > "$f"
              echo 'exit 0' >> "$f"
              chmod +x "$f"
            fi
          done
          # Also patch the podspec script phase
          find ios/Pods -path "*ExpoModulesJSI*" -name "*.sh" -type f 2>/dev/null | while read f; do
            echo "Patching: $f"
            echo '#!/bin/bash' > "$f"
            echo 'exit 0' >> "$f"
            chmod +x "$f"
          done
          echo "=== Done patching ==="

      - name: Find workspace and scheme
        id: find
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | sed -n '/Schemes:/,/Targets:/p' | grep -v "Schemes:" | grep -v "Targets:" | head -1 | xargs)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Found workspace: $WORKSPACE"
          echo "Found scheme: $SCHEME"

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            -clean \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            find build -type f -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "${{ github.workspace }}/PandaMusicStreamer.ipa" Payload
          ls -lh "${{ github.workspace }}/PandaMusicStreamer.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaMusicStreamer-unsigned
          path: PandaMusicStreamer.ipa
          retention-days: 14
