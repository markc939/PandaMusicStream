name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public CI repo
        uses: actions/checkout@v4

      - name: Checkout private app repo
        uses: actions/checkout@v4
        with:
          repository: markc939/Panda-Music-Stream
          ssh-key: ${{ secrets.PRIVATE_REPO_KEY }}
          path: private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private/package-lock.json

      - name: Show runner environment
        run: |
          echo "=== Runner ==="
          uname -a
          echo "=== Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null
          echo "=== Default Xcode ==="
          xcodebuild -version
          echo "=== Swift ==="
          swift --version 2>&1 | head -1
          echo "=== Toolchains ==="
          ls /Library/Developer/Toolchains/ 2>/dev/null || echo "none"
          echo "=== xcrun swift ==="
          xcrun swift --version 2>&1 | head -1

      - name: Install dependencies
        working-directory: private
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        working-directory: private
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: private/ios
        run: pod install

      - name: Build release app
        working-directory: private
        env:
          NODE_BINARY: /Users/runner/hostedtoolcache/node/22.23.1/arm64/bin/node
        run: |
          npx expo run:ios --no-install --configuration Release --device --no-install 2>&1 | tee build.log | tail -50
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== exit code: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            grep -i "error" build.log | grep -v "note:" | grep -v "warning:" | grep -v "DEPRECATED" | head -30
          fi
          exit $BUILD_EXIT

      - name: Create unsigned IPA
        if: always()
        working-directory: private/ios
        run: |
          echo "=== Searching for .app ==="
          ls -la build/Build/Products/Debug-iphoneos/ 2>/dev/null | head -20
          APP=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "=== Last 30 lines of build log ==="
            tail -30 build.log 2>/dev/null || echo "No build log"
            exit 1
          fi
          echo "Found: $APP"
          # Ad-hoc sign with codesign (bypasses xcodebuild iOS 26.5 restriction)
          echo "Signing app with ad-hoc identity..."
          codesign --force --sign - "$APP"
          echo "Verifying signature..."
          codesign --verify --verbose "$APP" 2>&1 || true
          echo "Creating IPA..."
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "${{ github.workspace }}/PandaMusicStreamer.ipa" Payload
          ls -lh "${{ github.workspace }}/PandaMusicStreamer.ipa"
          # Verify IPA structure
          echo "=== IPA contents ==="
          unzip -l "${{ github.workspace }}/PandaMusicStreamer.ipa" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaMusicStreamer-unsigned
          path: PandaMusicStreamer.ipa
          retention-days: 14
