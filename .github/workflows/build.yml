name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout public CI repo
        uses: actions/checkout@v4

      - name: Checkout private app repo
        uses: actions/checkout@v4
        with:
          repository: markc939/Panda-Music-Stream
          ssh-key: ${{ secrets.PRIVATE_REPO_KEY }}
          path: private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private/package-lock.json

      - name: Select latest available Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 | xargs -I {} sudo xcode-select -s {}
          xcodebuild -version

      - name: Install dependencies
        working-directory: private
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        working-directory: private
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: private/ios
        run: pod install

      - name: Build unsigned IPA with expo run:ios
        working-directory: private
        run: |
          npx expo run:ios --no-install --configuration Debug 2>&1 | tail -20
          echo "=== Searching for .app ==="
          find . -name "PandaMusicStreamer.app" -type d -maxdepth 8 2>/dev/null | head -5
          find . -path "*/Build/Products/*.app" -type d -maxdepth 8 2>/dev/null | head -5
          # Build output goes to default DerivedData
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -maxdepth 6 2>/dev/null | grep -v "Pods/" | grep -v "XCFramework" | head -1)
          if [ -n "$APP" ]; then
            echo "Found app: $APP"
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r PandaMusicStreamer.ipa Payload
            rm -rf Payload
            ls -lh PandaMusicStreamer.ipa
          else
            echo "No .app found, trying build/..."
            APP=$(find build -name "*.app" -type d -maxdepth 6 2>/dev/null | grep -v "Pods/" | head -1)
            if [ -n "$APP" ]; then
              echo "Found app: $APP"
              mkdir -p Payload && cp -r "$APP" Payload/ && zip -r PandaMusicStreamer.ipa Payload && rm -rf Payload
            else
              echo "No .app found at all"
              exit 1
            fi
        env:
          EXPO_NO_DEV_CLIENT: 1

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaMusicStreamer-unsigned
          path: PandaMusicStreamer.ipa
          retention-days: 14
