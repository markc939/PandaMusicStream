name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public CI repo
        uses: actions/checkout@v4

      - name: Checkout private app repo
        uses: actions/checkout@v4
        with:
          repository: markc939/Panda-Music-Stream
          ssh-key: ${{ secrets.PRIVATE_REPO_KEY }}
          path: private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private/package-lock.json

      - name: Show runner environment
        run: |
          echo "=== Runner ==="
          uname -a
          echo "=== Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null
          echo "=== Default Xcode ==="
          xcodebuild -version
          echo "=== Swift ==="
          swift --version 2>&1 | head -1
          echo "=== Toolchains ==="
          ls /Library/Developer/Toolchains/ 2>/dev/null || echo "none"
          echo "=== xcrun swift ==="
          xcrun swift --version 2>&1 | head -1

      - name: Install dependencies
        working-directory: private
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        working-directory: private
        run: npx expo prebuild --platform ios --clean

      - name: Show bundler script content
        working-directory: private/ios
        run: |
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("PandaMusicStreamer.xcodeproj")
            project.targets.each do |target|
              next unless target.name == "PandaMusicStreamer"
              target.shell_script_build_phases.each do |phase|
                if phase.name&.include?("Bundle React Native")
                  puts "=== Bundler script ==="
                  puts phase.shell_script
                end
              end
            end
          '

      - name: Install CocoaPods
        working-directory: private/ios
        run: pod install

      - name: Build release app
        working-directory: private/ios
        env:
          NODE_BINARY: /Users/runner/hostedtoolcache/node/22.23.1/arm64/bin/node
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # Manually bundle JS before the build
          echo "=== Bundling JS ==="
          cd ..
          ENTRY=$(node -e "require('expo/scripts/resolveAppEntry')" "$(pwd)" ios absolute 2>/dev/null | tail -n 1)
          echo "Entry: ${ENTRY:-node_modules/expo-router/entry}"
          npx expo export:embed \
            --platform ios \
            --dev false \
            --entry-file "${ENTRY:-node_modules/expo-router/entry}" \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios 2>&1 | tail -10
          echo "=== Bundle result ==="
          ls -lh ios/main.jsbundle 2>/dev/null || echo "No main.jsbundle!"
          ls ios/assets/ 2>/dev/null | head -5 || echo "No assets dir"
          cd ios
          # Skip the bundler in xcodebuild
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme PandaMusicStreamer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_BUNDLING=1 2>&1 | tee build.log | tail -20
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== xcodebuild exit code: $BUILD_EXIT ==="
          exit $BUILD_EXIT

      - name: Create unsigned IPA
        if: always()
        working-directory: private/ios
        run: |
          set -x
          echo "=== Searching for .app ==="
          ls -la build/Build/Products/Release-iphoneos/ 2>/dev/null | head -20
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "=== Last 30 lines of build log ==="
            tail -30 build.log 2>/dev/null || echo "No build log"
            exit 1
          fi
          echo "Found: $APP"
          # Ensure JS bundle and assets are inside the .app
          echo "=== Checking for main.jsbundle in .app ==="
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "main.jsbundle NOT found in .app — copying from project"
            ls -lh main.jsbundle 2>/dev/null && cp main.jsbundle "$APP/" && echo "Copied main.jsbundle"
          fi
          if [ -d assets ]; then
            echo "Copying assets into .app..."
            cp -r assets "$APP/"
          fi
          ls -lh "$APP/main.jsbundle" 2>/dev/null || echo "No main.jsbundle in .app!"
          # Ad-hoc sign with codesign (bypasses xcodebuild iOS 26.5 restriction)
          echo "Signing app with ad-hoc identity..."
          codesign --force --sign - "$APP"
          echo "Verifying signature..."
          codesign --verify --verbose "$APP" 2>&1 || true
          echo "Creating IPA..."
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "${{ github.workspace }}/PandaMusicStreamer.ipa" Payload
          ls -lh "${{ github.workspace }}/PandaMusicStreamer.ipa"
          # Verify IPA structure
          echo "=== IPA contents ==="
          unzip -l "${{ github.workspace }}/PandaMusicStreamer.ipa" | head -20

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PandaMusicStreamer-unsigned
          path: PandaMusicStreamer.ipa
          retention-days: 14
