name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout public CI repo
        uses: actions/checkout@v4

      - name: Checkout private app repo
        uses: actions/checkout@v4
        with:
          repository: markc939/Panda-Music-Stream
          ssh-key: ${{ secrets.PRIVATE_REPO_KEY }}
          path: private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private/package-lock.json

      - name: Select latest Xcode & install Swift 6.3 toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Xcode: $(xcodebuild -version)"
          echo "Swift: $(swift --version 2>&1 | head -1)"
          echo "=== Installing Swift 6.3 toolchain ==="
          TOOLCHAIN_PKG="swift-6.3-DEVELOPMENT-SNAPSHOT-2025-07-22-a-osx.pkg"
          TOOLCHAIN_URL="https://download.swift.org/development/xcode/latest-maintenance-swift-6_3-branch/xcode/swift-6.3-DEVELOPMENT-SNAPSHOT-2025-07-22-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2025-07-22-a-osx.pkg"
          curl -sL -o "/tmp/$TOOLCHAIN_PKG" "$TOOLCHAIN_URL" && echo "Downloaded toolchain"
          sudo installer -pkg "/tmp/$TOOLCHAIN_PKG" -target / && echo "Installed toolchain"
          TC_PATH=$(ls -d /Library/Developer/Toolchains/swift-6.3* 2>/dev/null | tail -1)
          if [ -n "$TC_PATH" ]; then
            TC_NAME=$(basename "$TC_PATH" .xctoolchain)
            echo "TOOLCHAINS=$TC_NAME" >> $GITHUB_ENV
            echo "Using Swift toolchain: $TC_NAME"
          else
            echo "No Swift 6.3 toolchain found, using default"
          fi
          swift --version 2>&1 | head -1

      - name: Install dependencies
        working-directory: private
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        working-directory: private
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: private/ios
        run: pod install

      - name: Build unsigned app with xcodebuild
        working-directory: private/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | sed -n '/Schemes:/,/Targets:/p' | grep -v "Schemes:" | grep -v "Targets:" | head -1 | xargs)
          echo "Building workspace: $WORKSPACE scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        working-directory: private/ios
        run: |
          APP=$(find build -name "*.app" -type d -maxdepth 4 | grep -v "Pods/" | grep -v "XCFramework" | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found in build/"
            find build -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "${{ github.workspace }}/PandaMusicStreamer.ipa" Payload
          ls -lh "${{ github.workspace }}/PandaMusicStreamer.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaMusicStreamer-unsigned
          path: PandaMusicStreamer.ipa
          retention-days: 14
