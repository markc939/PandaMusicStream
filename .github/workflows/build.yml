name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public CI repo
        uses: actions/checkout@v4

      - name: Checkout private app repo
        uses: actions/checkout@v4
        with:
          repository: markc939/Panda-Music-Stream
          ssh-key: ${{ secrets.PRIVATE_REPO_KEY }}
          path: private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: private/package-lock.json

      - name: Show runner environment
        run: |
          echo "=== Runner ==="
          uname -a
          echo "=== Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null
          echo "=== Default Xcode ==="
          xcodebuild -version
          echo "=== Swift ==="
          swift --version 2>&1 | head -1
          echo "=== Toolchains ==="
          ls /Library/Developer/Toolchains/ 2>/dev/null || echo "none"
          echo "=== xcrun swift ==="
          xcrun swift --version 2>&1 | head -1

      - name: Install dependencies
        working-directory: private
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        working-directory: private
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: private/ios
        run: pod install

      - name: Build unsigned app with xcodebuild
        working-directory: private/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # Find the app scheme (not pod schemes like EXApplication)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | sed -n '/Schemes:/,/Targets:/p' | grep -v "Schemes:" | grep -v "Targets:" | grep -v "^$" | head -5)
          echo "Available schemes:"
          echo "$SCHEME"
          # Pick the first scheme that's NOT a pod (pod schemes start with EX, React, RN, etc.)
          APP_SCHEME=$(echo "$SCHEME" | grep -v "^EX" | grep -v "^React" | grep -v "^RN" | grep -v "^hermes" | grep -v "^Yoga" | grep -v "^Common" | head -1 | xargs)
          if [ -z "$APP_SCHEME" ]; then
            # Fallback: use the last scheme (app is usually listed last)
            APP_SCHEME=$(echo "$SCHEME" | tail -1 | xargs)
          fi
          echo "Using scheme: $APP_SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log | tail -30
          echo "Exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Create unsigned IPA
        if: always()
        working-directory: private/ios
        run: |
          echo "=== Searching for .app ==="
          find build -type d -name "*.app" 2>/dev/null | head -10
          find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | head -10
          echo "=== Last 20 lines of build log ==="
          tail -20 build.log 2>/dev/null || echo "No build log"
          APP=$(find build -name "*.app" -type d -maxdepth 6 | grep -v "Pods/" | grep -v "XCFramework" | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found"
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "${{ github.workspace }}/PandaMusicStreamer.ipa" Payload
          ls -lh "${{ github.workspace }}/PandaMusicStreamer.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaMusicStreamer-unsigned
          path: PandaMusicStreamer.ipa
          retention-days: 14
